name: CI

# 注意：本仓库托管在 Gitee，实际生效的 CI 是根目录的 .gitee-ci.yml。
# 此文件仅在将来迁移或镜像到 GitHub 时才会被识别，目前不会被触发。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 代码规范检查
        run: pnpm lint:ci

      - name: 单元测试
        run: pnpm test

      - name: 构建组件库
        run: pnpm build
