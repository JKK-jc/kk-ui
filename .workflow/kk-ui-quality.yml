# KK UI 质量门禁（Gitee Go 原生流水线）
#
# 说明：
# - 早期采用的 .gitee-ci.yml（GitLab Runner 风格）在当前版本的 Gitee Go 中不会被读取，
#   实测推送后无任何构建记录，因此改用本文件（.workflow/ 原生格式）。
# - 必须使用官方「Node.js 构建」插件 build@nodejs；npmbuild@1 已被废弃，
#   写成 npmbuild@1 会直接报「配置文件格式错误」。
# - 插件参数（nodeVersion / commands / artifacts）直接写在 step 下，不要再套一层 inputs:。
# - 插件自带的 Node 最高只有 15.12.0，而本项目要求 Node >= 18.12（pnpm 10 / Vite 5），
#   因此 commands 里会自行安装 glibc-217 兼容版 Node 20（CentOS 7/8 基础镜像均可运行）。
#   若哪天插件提供 18+ 版本，把 nodeVersion 改掉并删除第一段安装逻辑即可。

name: kk-ui-quality
displayName: 'KK UI 质量门禁'

triggers:
  push:
    - matchType: PRECISE
      branch: main
      commitMessage: ''

stages:
  - stage: quality
    displayName: '质量门禁'
    steps:
      - step: build@nodejs
        name: quality_check
        displayName: '类型检查 / 代码规范 / 单元测试 / 构建'
        nodeVersion: 14.16.0
        commands: |
          set -e
          echo '--- 环境信息 ---'
          uname -a
          ldd --version | head -1 || true

          # ---------- 1. 确保 Node >= 18 ----------
          NODE_DIR=/tmp/node20
          NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
          if [ "$NODE_MAJOR" -lt 18 ]; then
            echo "宿主 Node 为 $(node -v 2>/dev/null || echo '未知')，过低，安装 Node 20.19.4 ..."
            rm -rf "$NODE_DIR"
            mkdir -p "$NODE_DIR"
            curl -fsSL https://cdn.npmmirror.com/binaries/node-unofficial-builds/v20.19.4/node-v20.19.4-linux-x64-glibc-217.tar.gz -o /tmp/node20.tar.gz
            tar -xzf /tmp/node20.tar.gz -C "$NODE_DIR" --strip-components=1
            rm -f /tmp/node20.tar.gz
            export PATH="$NODE_DIR/bin:$PATH"
            hash -r
          fi
          node -v
          npm -v

          # ---------- 2. 安装依赖 ----------
          npm config set registry https://registry.npmmirror.com
          npm i -g pnpm@10.30.3
          pnpm config set store-dir /tmp/.pnpm-store
          pnpm install --frozen-lockfile

          # ---------- 3. 质量门禁（任一步失败即整体失败）----------
          pnpm typecheck
          # 注意：这里跑 lint:ci 而不是 lint，后者带 --fix 会静默改写文件从而掩盖问题
          pnpm lint:ci
          pnpm test
          pnpm build
          echo '质量门禁全部通过'
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./packages/kk-ui/dist
