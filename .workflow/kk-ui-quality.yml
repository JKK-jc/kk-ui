# - 除了质量门禁，本流水线还会在全部检查通过后构建 VitePress 文档站，
#   并把 docs/.vitepress/dist 推送到 gh-pages 分支，由 Gitee Pages 托管对外访问。
#   详见文件末尾「5. 发布」一段，需要仓库全局参数 GITEE_TOKEN。

# KK UI 质量门禁 + 文档发布（Gitee Go 原生流水线）
#
# 说明：
# - 早期采用的 .gitee-ci.yml（GitLab Runner 风格）在当前版本的 Gitee Go 中不会被读取，
#   实测推送后无任何构建记录，因此改用本文件（.workflow/ 原生格式）。
# - 必须使用官方「Node.js 构建」插件 build@nodejs；npmbuild@1 已被废弃，
#   写成 npmbuild@1 会直接报「配置文件格式错误」。
# - 插件参数（nodeVersion / commands / artifacts）直接写在 step 下，不要再套一层 inputs:。
# - 插件自带的 Node 最高只有 15.12.0，而本项目要求 Node >= 18.12（pnpm 10 / Vite 5），
#   因此 commands 里会自行安装 glibc-217 兼容版 Node 20（CentOS 7/8 基础镜像均可运行）。
#   若哪天插件提供 18+ 版本，把 nodeVersion 改掉并删除第一段安装逻辑即可。

name: kk-ui-quality
displayName: 'KK UI 质量门禁'

# 触发器说明（当前版本 Gitee Go 的格式，与旧版 matchType: PRECISE 不同）：
# - 分支 / Tag / 提交注释三类匹配规则是「交集」关系，同时配置时必须全部满足才触发。
# - 因此这里只配分支精确匹配 main，不配 commitMessages（配了空串会永远匹配不上）。
triggers:
  push:
    branches:
      precise:
        - main

stages:
  - stage: quality
    displayName: '质量门禁 + 文档发布'
    steps:
      - step: build@nodejs
        name: quality_check
        displayName: '类型检查 / 代码规范 / 单元测试 / 构建 / 发布文档站'
        nodeVersion: 14.16.0
        commands: |
          set -e
          echo '--- 环境信息 ---'
          uname -a
          ldd --version | head -1 || true

          # ---------- 1. 确保 Node >= 18 ----------
          NODE_DIR=/tmp/node20
          NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || echo 0)
          if [ "$NODE_MAJOR" -lt 18 ]; then
            echo "宿主 Node 为 $(node -v 2>/dev/null || echo '未知')，过低，安装 Node 20.19.4 ..."
            rm -rf "$NODE_DIR"
            mkdir -p "$NODE_DIR"
            curl -fsSL https://cdn.npmmirror.com/binaries/node-unofficial-builds/v20.19.4/node-v20.19.4-linux-x64-glibc-217.tar.gz -o /tmp/node20.tar.gz
            tar -xzf /tmp/node20.tar.gz -C "$NODE_DIR" --strip-components=1
            rm -f /tmp/node20.tar.gz
            export PATH="$NODE_DIR/bin:$PATH"
            hash -r
          fi
          node -v
          npm -v

          # ---------- 2. 安装依赖 ----------
          npm config set registry https://registry.npmmirror.com
          npm i -g pnpm@10.30.3
          pnpm config set store-dir /tmp/.pnpm-store
          pnpm install --frozen-lockfile

          # ---------- 3. 质量门禁（任一步失败即整体失败，失败则不会发布文档）----------
          pnpm typecheck
          # 注意：这里跑 lint:ci 而不是 lint，后者带 --fix 会静默改写文件从而掩盖问题
          pnpm lint:ci
          pnpm test
          pnpm build
          echo '质量门禁全部通过'

          # ---------- 4. 构建文档站 ----------
          # 产物在 docs/.vitepress/dist，部署所用的 base 子路径已写死在
          # docs/.vitepress/config.ts 里（生产构建时为 /kk-ui/，对应 Gitee Pages 地址）。
          pnpm docs:build
          ls -la docs/.vitepress/dist

          # ---------- 5. 发布到 gh-pages 分支，由 Gitee Pages 托管 ----------
          # 需要在仓库「全局参数」里配置 GITEE_TOKEN（Gitee 私人令牌），否则跳过发布。
          # 用 gh-pages 分支而不是 main，既避免污染源码分支，也不会再次触发本流水线。
          TOKEN="${GITEE_TOKEN}"
          if [ -z "$TOKEN" ] || [ "$TOKEN" = '${GITEE_TOKEN}' ]; then
            echo '未检测到 GITEE_TOKEN，跳过文档发布（构建本身已成功）'
          else
            echo '开始发布文档站到 gh-pages 分支 ...'
            cd docs/.vitepress/dist
            git init
            git symbolic-ref HEAD refs/heads/gh-pages
            git add -A
            git -c user.email='ci@gitee.com' -c user.name='gitee-go' \
              commit -m "docs: publish site from commit ${GITEE_COMMIT_ID:-unknown}"
            git push --force "https://${TOKEN}@gitee.com/jiang-kangkang/kk-ui.git" HEAD:gh-pages
            echo '文档站已推送到 gh-pages 分支'
          fi
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./packages/kk-ui/dist
          - name: DOCS_ARTIFACT
            path:
              - ./docs/.vitepress/dist
