# Gitee CI 质量门禁
# 语法参考：https://gitee.com/help/articles/4200
#
# 说明：本仓库托管在 Gitee，实际生效的 CI 是此文件。
# .github/workflows/ci.yml 仅用于未来迁移/镜像到 GitHub 时复用。

image: node:20

stages:
  - check
  - build

variables:
  npm_config_registry: https://registry.npmmirror.com
  PNPM_STORE_DIR: .pnpm-store

# 缓存 pnpm 内容寻址仓库，避免每个 job 重复下载同一个包
cache:
  key: pnpm-store
  paths:
    - .pnpm-store/

# 所有 job 共用：corepack 会依据 package.json 的 packageManager 字段
# 自动装配 pnpm@10.30.3，无需在镜像里预装，也避免版本漂移
before_script:
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

typecheck:
  stage: check
  script:
    - pnpm typecheck

lint:
  stage: check
  script:
    # 用 lint:ci 而非 lint，后者带 --fix 会静默改写文件从而掩盖问题
    - pnpm lint:ci

unit-test:
  stage: check
  script:
    - pnpm test

build-lib:
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - packages/kk-ui/dist/
    expire_in: 1 week

build-docs:
  stage: build
  script:
    - pnpm docs:build
  artifacts:
    paths:
      - docs/.vitepress/dist/
    expire_in: 1 week
